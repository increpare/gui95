# Include inside the existing ded.increpare.com HTTPS server block.
# Verify that /gui95/ is unused first; do not replace the existing site.
location = /gui95 {
    return 308 /gui95/;
}
location ^~ /gui95/ {
    proxy_pass http://127.0.0.1:3295;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 20s;
    client_max_body_size 100k;
    access_log off;
}
