# Alternative for an existing Apache HTTPS virtual host, with proxy,
# proxy_http and headers already enabled. Check the host before applying.
<Location "/gui95/">
    ProxyPass "http://127.0.0.1:3295/gui95/"
    ProxyPassReverse "http://127.0.0.1:3295/gui95/"
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
</Location>
