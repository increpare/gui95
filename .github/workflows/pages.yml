name: Verify and publish demo
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install MCP service dependencies
        run: npm --prefix mcp ci --ignore-scripts --no-audit --no-fund
      - name: Test MCP service and HTTP protocol
        run: npm --prefix mcp test
      - name: Install local verification dependencies
        run: npm --prefix kit ci --ignore-scripts --no-audit --no-fund
      - name: Install verification browser
        run: cd kit && npx playwright install --with-deps chromium
      - name: Test build kit, browser interactions and delivery helpers
        run: node --test kit/test/*.test.mjs tools/test/*.test.mjs
      - name: Verify reference hashes and documentation
        shell: pwsh
        run: ./tools/verify-reference.ps1
      - name: Check demo syntax
        run: node --check demo/dist/desktop.js
      - name: Verify standalone widget outputs
        run: node tools/build-widget-examples.mjs --check
      - name: Build complete MCP deployment and remote-plugin bundles
        run: node mcp/package.mjs
      - name: Build distributable skill
        shell: pwsh
        run: ./tools/package-skill.ps1
      - name: Build directory plugin package
        shell: pwsh
        run: ./tools/package-plugin.ps1
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist
      - uses: actions/deploy-pages@v4
        id: deployment
